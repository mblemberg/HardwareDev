[project]
name = "hw-analysis-framework"
version = "0.0.1"
description = "Framework for collaborative worst-case circuit analysis with units, scenarios, and traceable provenance."
authors = [
    { name = "Mike Blemberg", email = "mikeblemberg@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pint (>=0.24,<0.25)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=8.0,<9.0)",
    "pytest-cov (>=5.0,<6.0)",
    "mypy (>=1.10,<2.0)",
]

[tool.poetry]
packages = [{ include = "framework", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["framework"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src/framework"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
