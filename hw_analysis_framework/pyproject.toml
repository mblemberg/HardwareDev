[project]
name = "hw-analysis-framework"
version = "0.0.1"
description = "Framework for collaborative worst-case circuit analysis with units, scenarios, and traceable provenance."
authors = [
    { name = "Mike Blemberg", email = "mikeblemberg@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pint (>=0.24,<0.25)",
    "pydantic (>=2.5,<3.0)",
    "sf-hamilton (>=1.80,<2.0)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=8.0,<9.0)",
    "pytest-cov (>=5.0,<6.0)",
    "mypy (>=1.10,<2.0)",
    "ruff (>=0.6,<0.7)",
]
notebooks = [
    "jupyterlab (>=4.0,<5.0)",
    "ipykernel (>=6.0,<7.0)",
]

[tool.poetry]
packages = [{ include = "framework", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["framework"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src/framework"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Broad rule set, minus pydocstyle (D — too noisy on existing codebase).
# Enabled per-step during Phase 1 review; not auto-fixed across the whole tree
# in one go. See workspace CLAUDE.md "Current workflow" for the rationale.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "A",    # flake8-builtins (shadowing)
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports (provides the banned-api Pint rule below)
    "RET",  # flake8-return
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pint.UnitRegistry".msg = "Import `registry` from `framework.units`; mixed Pint registries silently break unit math (design doc §16 item 2)."

[tool.ruff.lint.per-file-ignores]
# units.py intentionally uses mixed-case engineering symbols (mV, mA, kHz, mOhm,
# degC, etc.) that match the symbols engineers actually write. N816 (mixed-case
# in global scope) would flag every one of them — but they are the entire point
# of the file.
"src/framework/units.py" = ["N816"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
