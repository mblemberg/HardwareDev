# Operating corners for a 12V automotive product.
# Three project-global scenarios spanning the OPERATING_TEMP × VBAT envelope.

[[scenario]]
name = "nominal"
description = "Room-temp benchmark, nominal battery"
ambient_temp = "25 degC"
vbat = "12.0 V"

[[scenario]]
name = "cold_low_vin"
description = "Cold start, depleted battery — worst-case for current draw"
ambient_temp = "-40 degC"
vbat = "9.0 V"

[[scenario]]
name = "hot_high_vin"
description = "Hot ambient, alternator load — worst-case for dissipation"
ambient_temp = "85 degC"
vbat = "16.0 V"
